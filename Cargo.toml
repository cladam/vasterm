[package]
name = "vasterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native, zoomable workspace for terminal sessions"
authors = ["Claes Adamsson <claes.adamsson@gmail.com>"]
license = "MIT"
repository = "https://github.com/cladam/vasterm"
categories = ["command-line-interface"]

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "wgpu"] }
libc = "0.2"
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_system_font_provider = { version = "0.37", default-features = false }
