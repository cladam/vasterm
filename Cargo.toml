[package]
name = "vasterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native, zoomable workspace for terminal sessions"
authors = ["Claes Adamsson <claes.adamsson@gmail.com>"]
license = "MIT"
repository = "https://github.com/cladam/vasterm"
categories = ["command-line-interface"]

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
portable-pty = "0.9"
